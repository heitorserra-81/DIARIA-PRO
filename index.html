<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#121b35"><title>DiáriaPro — Demonstração</title><link rel="manifest" href="diariapro-manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><style>
:root{--bg:#f4f6fb;--dark:#121b35;--purple:#7158e9;--green:#19b88c;--muted:#7d879b;--line:#e6eaf3}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;color:#18213a}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #aaa0ff}.app{display:flex;min-height:100dvh}.side{width:268px;flex-shrink:0;background:var(--dark);color:white;padding:25px 16px;display:flex;flex-direction:column;gap:24px}.brand{padding:7px 12px}.brand strong{font-size:25px;letter-spacing:-1px}.brand i{font-style:normal;color:#9c8bff}.brand small{display:block;font-size:11px;color:#b4bdd1;margin-top:2px}.nav{display:grid;gap:6px}.nav button{display:flex;gap:12px;align-items:center;width:100%;border:0;border-radius:13px;padding:12px 14px;text-align:left;color:#b7c2df;background:transparent}.nav button.active,.nav button:hover{color:white;background:#293458}.side-bottom{margin-top:auto}.author{text-align:center;font-size:11px;color:#a9b6d2}.signature{white-space:nowrap;display:inline-block;color:white;font-weight:750;margin-top:7px;padding:9px 15px;position:relative;border-radius:14px;background:linear-gradient(#202d4e,#202d4e) padding-box,conic-gradient(from var(--turn),#6f5af0,#21cca8,#fff,#6f5af0) border-box;border:2px solid transparent;box-shadow:0 7px 20px #0002;animation:orbit 4s linear infinite;transform:perspective(300px) rotateX(7deg)}@property --turn{syntax:'<angle>';initial-value:0deg;inherits:false}@keyframes orbit{to{--turn:360deg}}.main{flex:1;min-width:0}.top{background:white;padding:15px 30px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);gap:12px}.top small{color:var(--muted)}.top button,.plain{border:1px solid var(--line);background:white;border-radius:12px;padding:10px 13px;color:#26324b}.hamb{display:none}.content{padding:28px 30px;max-width:1400px;margin:auto}.eyebrow{color:var(--purple);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1.4px}.intro{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:24px}h1{font-size:clamp(25px,3vw,36px);margin:6px 0 5px;letter-spacing:-1px;line-height:1.15}p{margin:0;color:var(--muted)}.btn{border:0;background:var(--purple);color:white;font-weight:700;padding:12px 17px;border-radius:12px;box-shadow:0 6px 18px #7158e933}.btn.green{background:var(--green)}.btn.light{background:#eeeafb;color:#5f4cc6;box-shadow:none}.btn:disabled{opacity:.5;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.card{background:white;border-radius:21px;padding:22px;box-shadow:0 8px 30px #1d295108;border:1px solid #edf0f7;min-width:0}.kpi{grid-column:span 3;min-height:140px}.kpi span{color:var(--muted);font-size:13px}.kpi strong{display:block;font-size:29px;margin:10px 0 4px;letter-spacing:-1px}.kpi em{font-style:normal;color:var(--green);font-size:12px}.wide{grid-column:span 8}.narrow{grid-column:span 4}.half{grid-column:span 6}.full{grid-column:span 12}.hero{background:linear-gradient(120deg,#202c53,#41337d 72%,#675be0);color:white;padding:28px}.hero p{color:#d9d8f4}.hero .btn{background:white;color:#4034a3;margin-top:19px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}.sectionhead h2{font-size:18px;margin:0}.tag{display:inline-block;font-size:11px;padding:5px 9px;border-radius:100px;color:#0a8465;background:#ddfaf1;font-weight:700}.tag.blue{color:#5142bb;background:#eeebff}.row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:1px solid var(--line);gap:12px}.row:first-of-type{border-top:0}.row h3{margin:0 0 4px;font-size:15px}.row p{font-size:12px}.stack{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tiny{font-size:12px;padding:8px 10px;box-shadow:none}.foot{padding:24px;text-align:center;color:#758098;background:#fff;border-top:1px solid var(--line)}.foot .signature{color:#26324b;background:linear-gradient(white,white) padding-box,conic-gradient(from var(--turn),#6f5af0,#21cca8,#6f5af0) border-box}.field{display:grid;gap:5px;margin-bottom:14px}.field label{font-weight:650;font-size:13px}.field input,.field select,.field textarea{border:1px solid #dce2ef;padding:12px;border-radius:10px;width:100%;background:#fff;color:#18213a}.field textarea{min-height:95px;resize:vertical}.overlay{position:fixed;inset:0;background:#111b32a3;display:none;align-items:center;justify-content:center;padding:16px;z-index:30}.overlay.open{display:flex}.dialog{background:white;border-radius:20px;padding:24px;max-width:500px;width:100%;max-height:88dvh;overflow:auto}.dialog header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.dialog h2{margin:0}.toast{position:fixed;bottom:22px;right:22px;background:#14233d;color:white;padding:13px 20px;border-radius:14px;box-shadow:0 8px 30px #0003;z-index:40;display:none}.mobilecover{display:none}.select{border:1px solid #e0e5ef;border-radius:11px;padding:11px;background:#fff;color:#333}.empty{padding:20px;color:#8792a6;background:#f8f9fc;border-radius:12px;text-align:center}.profilepick{display:flex;align-items:center;gap:8px}.profilepick select{max-width:160px}.pill{font-size:12px;font-weight:700;color:#7365db;background:#eeecff;border-radius:30px;padding:5px 10px}@media(max-width:1050px){.kpi{grid-column:span 6}.wide,.narrow{grid-column:span 12}.half{grid-column:span 6}}@media(max-width:760px){.side{position:fixed;z-index:20;inset:0 auto 0 0;transform:translateX(-100%);transition:.25s;box-shadow:12px 0 35px #0003}.side.open{transform:translateX(0)}.mobilecover.on{display:block;position:fixed;inset:0;background:#0d142988;z-index:19}.hamb{display:inline-block}.top{padding:12px 16px}.top small{display:none}.content{padding:23px 15px}.intro{align-items:flex-start;flex-direction:column}.intro .btn{width:100%}.kpi{grid-column:span 6}.half{grid-column:span 12}.kpi{padding:17px;min-height:110px}.kpi strong{font-size:25px}.hero{padding:24px}.card{padding:18px}.row{align-items:flex-start}.row .stack{justify-content:flex-end}.profilepick select{max-width:125px}.foot{padding:20px}}
</style></head><body><div class="app"><aside class="side" id="side"><div class="brand"><strong>◈ Diária<i>Pro</i></strong><small>Projeto exclusivo para Lae L.</small></div><nav class="nav" id="nav"></nav><div class="side-bottom"><div class="author">DESENVOLVIDO POR<br><span class="signature">Heitor Serra Neto</span></div></div></aside><div class="mobilecover" id="cover" onclick="closeMenu()"></div><div class="main"><div class="top"><div class="stack"><button class="hamb" onclick="toggleMenu()" aria-label="Abrir menu">☰</button><b id="crumb">Visão geral</b><small> • Ambiente de demonstração</small></div><div class="profilepick"><span class="pill">● Demo</span><select class="select" id="profile" onchange="setProfile(this.value)" aria-label="Selecionar perfil"><option value="empresa">Empresa</option><option value="profissional">Profissional</option><option value="admin">Administrador</option></select></div></div><main class="content" id="view"></main><footer class="foot">Desenvolvido por<br><span class="signature">Heitor Serra Neto</span><p style="margin-top:12px;font-size:12px">DiáriaPro é um nome e uma demonstração provisórios. Nenhum pagamento é realizado.</p></footer></div></div><div class="overlay" id="modal" onclick="if(event.target===this)hideModal()"><div class="dialog"><header><h2 id="mtitle"></h2><button class="plain" onclick="hideModal()" aria-label="Fechar">✕</button></header><div id="mbody"></div></div></div><div class="toast" id="toast"></div><script>
const DATAKEY='diariapro-demo-v3';let db;const seed=()=>({jobs:[{id:1,title:'Garçom para evento',company:'Bistrô Central',city:'Campinas, SP',date:'2026-10-17',value:180,slots:2,category:'Atendimento',description:'Atendimento ao público em evento noturno.'},{id:2,title:'Auxiliar de cozinha',company:'Restaurante Jardim',city:'Holambra, SP',date:'2026-10-18',value:160,slots:1,category:'Cozinha',description:'Preparo e organização da cozinha.'},{id:3,title:'Recepcionista',company:'Hotel Aurora',city:'Jaguariúna, SP',date:'2026-10-20',value:210,slots:1,category:'Recepção',description:'Recepção de hóspedes.'}],applications:[],contracts:[],messages:[{id:1,from:'Suporte',message:'Bem-vindo à demonstração! Navegue pelos perfis para testar os fluxos.',date:'11/10'}],reviews:[],notifications:[],next:10});try{db=JSON.parse(localStorage.getItem(DATAKEY))||seed()}catch{db=seed()}let profile='empresa',page='home';const $=x=>document.getElementById(x),save=()=>localStorage.setItem(DATAKEY,JSON.stringify(db)),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=v=>Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),date=d=>new Date(d+'T12:00:00').toLocaleDateString('pt-BR'),uid=()=>db.next++,notify=m=>{db.notifications.unshift({id:uid(),message:m,date:new Date().toLocaleDateString('pt-BR')});save();toast(m)},toast=m=>{let t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(window.toasttimer);window.toasttimer=setTimeout(()=>t.style.display='none',3500)};
const items=[['home','⌂','Visão geral'],['jobs','▤','Oportunidades'],['applications','◉','Candidaturas'],['contracts','▣','Contratos'],['chat','◌','Mensagens'],['finance','▥','Financeiro'],['reviews','★','Avaliações'],['notifications','♧','Notificações'],['settings','⚙','Configurações']];function toggleMenu(){$('side').classList.toggle('open');$('cover').classList.toggle('on')}function closeMenu(){$('side').classList.remove('open');$('cover').classList.remove('on')}function setProfile(p){profile=p;page='home';render();closeMenu()}function go(p){page=p;render();closeMenu();scrollTo({top:0,behavior:'smooth'})}function header(title,sub,action=''){return `<div class="intro"><div><div class="eyebrow">DiáriaPro · ${esc(profile)}</div><h1>${title}</h1><p>${sub}</p></div>${action}</div>`}function action(label,fn,cls=''){return `<button class="btn ${cls}" onclick="${fn}">${label}</button>`}function card(label,value,note){return `<div class="card kpi"><span>${label}</span><strong>${value}</strong><em>${note}</em></div>`}function empty(t){return `<div class="empty">${t}</div>`}function jobRow(j){let applied=db.applications.some(a=>a.jobId===j.id),own=j.company==='Minha empresa',canApply=profile==='profissional'&&!applied;return `<div class="row"><div><h3>${esc(j.title)}</h3><p>${esc(j.company)} · ${esc(j.city)} · ${date(j.date)}</p><div class="stack" style="margin-top:8px"><span class="tag blue">${esc(j.category)}</span><span class="tag">${j.slots} vaga(s)</span></div></div><div style="text-align:right;flex-shrink:0"><b>${money(j.value)}</b><div style="margin-top:9px">${canApply?action('Candidatar-se',`apply(${j.id})`,'tiny'):profile==='profissional'?'<span class="tag">Candidatura enviada</span>':action('Detalhes',`detail(${j.id})`,'tiny light')}</div></div></div>`}function home(){let total=db.jobs.length,waiting=db.applications.filter(a=>a.status==='Pendente').length,active=db.contracts.filter(c=>c.status==='Em andamento').length,done=db.contracts.filter(c=>c.status==='Concluído').length;let title=profile==='profissional'?'Seu próximo trabalho começa aqui':profile==='admin'?'Tudo sob controle':'Sua equipe, no momento certo';return header('Olá, bem-vindo!','Um jeito inteligente de conectar empresas e profissionais.',action(profile==='empresa'?'＋ Publicar diária':profile==='profissional'?'Explorar oportunidades':'Ver candidaturas',profile==='empresa'?"openJob()":profile==='profissional'?"go('jobs')":"go('applications')"))+`<div class="grid">${card('Diárias abertas',total,'Oportunidades disponíveis')}${card('Candidaturas pendentes',waiting,'Aguardando decisão')}${card('Contratos ativos',active,'Trabalhos em andamento')}${card('Diárias concluídas',done,'Histórico demonstrativo')}<div class="card hero wide"><div class="eyebrow" style="color:#a5f8e5">Conexões que fazem acontecer</div><h1>${title}</h1><p>Publique, encontre, contrate e acompanhe diárias em um só lugar. Experimente todos os perfis.</p>${action('Explorar plataforma',"go('jobs')")}</div><div class="card narrow"><div class="sectionhead"><h2>Próximos passos</h2><span class="tag">Demo</span></div><p>Troque de perfil no topo e percorra o ciclo completo: publicar vaga, candidatar-se, aprovar, contratar e concluir.</p><div style="margin-top:18px">${action('Ver contratos',"go('contracts')",'light')}</div></div><div class="card full"><div class="sectionhead"><h2>Oportunidades em destaque</h2>${action('Ver todas',"go('jobs')",'tiny light')}</div>${db.jobs.slice(0,3).map(jobRow).join('')}</div></div>`}
function jobs(){return header('Oportunidades','Encontre ou publique diárias de trabalho.',profile==='empresa'?action('＋ Nova diária','openJob()'):'')+`<div class="grid"><div class="card full"><div class="sectionhead"><h2>Vagas disponíveis</h2><span class="pill">${db.jobs.length} vagas cadastradas</span></div>${db.jobs.length?db.jobs.map(jobRow).join(''):empty('Nenhuma oportunidade cadastrada.')}</div></div>`}function applications(){return header('Candidaturas','Gerencie os interessados e acompanhe seleções.')+`<div class="card">${db.applications.length?db.applications.map(a=>{let j=db.jobs.find(j=>j.id===a.jobId);return `<div class="row"><div><h3>${esc(j?.title||'Vaga')}</h3><p>${esc(a.name)} · ${esc(a.note||'Disponível para trabalhar')}</p><span class="tag ${a.status==='Pendente'?'blue':''}">${esc(a.status)}</span></div><div class="stack">${a.status==='Pendente'&&profile!=='profissional'?action('Aprovar',`approve(${a.id})`,'tiny green')+action('Recusar',`reject(${a.id})`,'tiny light'):''}</div></div>`}).join(''):empty('Nenhuma candidatura ainda. Troque para o perfil Profissional e candidate-se a uma vaga.')}</div>`}function contracts(){return header('Contratos','Acompanhe confirmações e execução das diárias.')+`<div class="card">${db.contracts.length?db.contracts.map(c=>{let j=db.jobs.find(j=>j.id===c.jobId);return `<div class="row"><div><h3>${esc(j?.title||'Diária')} — ${esc(c.name)}</h3><p>${esc(j?.company)} · ${money(j?.value||0)} · ${j?date(j.date):''}</p><span class="tag ${c.status==='Em andamento'?'blue':''}">${esc(c.status)}</span></div><div class="stack">${action('Visualizar',`contractDetail(${c.id})`,'tiny light')}${c.status==='Em andamento'&&profile!=='profissional'?action('Concluir',`finish(${c.id})`,'tiny green'):''}</div></div>`}).join(''):empty('Contratos aparecerão aqui após aprovar uma candidatura.')}</div>`}function chat(){return header('Mensagens','Converse pelo chat demonstrativo local.')+`<div class="grid"><div class="card full"><div style="max-height:310px;overflow:auto">${db.messages.map(m=>`<div class="row"><div><b>${esc(m.from)}</b><p>${esc(m.message)}</p></div><small>${esc(m.date)}</small></div>`).join('')}</div><form onsubmit="sendMessage(event)" style="margin-top:20px"><div class="field"><label for="msg">Nova mensagem</label><textarea id="msg" required minlength="2" placeholder="Escreva sua mensagem..."></textarea></div><button class="btn">Enviar mensagem</button></form></div></div>`}function finance(){let total=db.contracts.filter(c=>c.status==='Concluído').reduce((s,c)=>s+Number(db.jobs.find(j=>j.id===c.jobId)?.value||0),0),pending=db.contracts.filter(c=>c.status==='Em andamento').reduce((s,c)=>s+Number(db.jobs.find(j=>j.id===c.jobId)?.value||0),0);return header('Financeiro','Valores simulados, sem transferência de dinheiro.')+`<div class="grid">${card('Total concluído',money(total),'Demonstrativo')}${card('Em andamento',money(pending),'Previsão')}${card('Transações reais','0','Não habilitadas')}${card('Taxas processadas','R$ 0','Modo de testes')}<div class="card full"><h2>Resumo financeiro</h2><p>Os valores são calculados a partir das diárias concluídas no navegador. Integração com pagamentos será configurada em uma etapa futura.</p></div></div>`}function reviews(){return header('Avaliações','Feedback de serviços concluídos.')+`<div class="card">${db.contracts.filter(c=>c.status==='Concluído').map(c=>{let r=db.reviews.find(r=>r.contractId===c.id);return `<div class="row"><div><h3>${esc(c.name)}</h3><p>${r?esc(r.comment)+' · '+r.stars+' ★':'Avaliação ainda não registrada'}</p></div>${!r?action('Avaliar',`review(${c.id})`,'tiny light'):''}</div>`}).join('')||empty('Conclua uma diária para poder avaliar.')}</div>`}function notifications(){return header('Notificações','Atualizações geradas no ambiente de teste.')+`<div class="card">${db.notifications.map(n=>`<div class="row"><div><h3>${esc(n.message)}</h3><p>${esc(n.date)}</p></div></div>`).join('')||empty('Nenhuma notificação por enquanto.')}</div>`}function settings(){return header('Configurações','Personalização e recursos da demonstração.')+`<div class="grid"><div class="card half"><h2>Identidade</h2><p>Nome provisório: DiáriaPro</p><p>Apresentação exclusiva para Lae L.</p><p>Desenvolvido por Heitor Serra Neto.</p></div><div class="card half"><h2>Ambiente de teste</h2><p>Os dados ficam guardados somente neste navegador.</p><p>Este HTML não recebe notificações push nem realiza pagamentos reais.</p><br>${action('Restaurar dados de exemplo','resetDemo()','light')}</div></div>`}function render(){let visible=profile==='profissional'?items.filter(x=>!['finance'].includes(x[0])):items;$('nav').innerHTML=visible.map(([id,icon,name])=>`<button class="${page===id?'active':''}" onclick="go('${id}')"><span style="font-size:20px">${icon}</span> ${name}</button>`).join('');$('profile').value=profile;$('crumb').textContent=items.find(x=>x[0]===page)?.[2]||'Visão geral';$('view').innerHTML=({home,jobs,applications,contracts,chat,finance,reviews,notifications,settings}[page]||home)()}
function showModal(title,html){$('mtitle').textContent=title;$('mbody').innerHTML=html;$('modal').classList.add('open')}function hideModal(){$('modal').classList.remove('open')}function openJob(){showModal('Publicar nova diária',`<form onsubmit="saveJob(event)"><div class="field"><label>Título da vaga</label><input name="title" required minlength="3" placeholder="Ex.: Garçom para evento"></div><div class="field"><label>Localidade</label><input name="city" required placeholder="Cidade, UF"></div><div class="field"><label>Data</label><input name="date" type="date" required min="2026-10-11"></div><div class="field"><label>Valor da diária (R$)</label><input name="value" type="number" min="1" max="999999" required></div><div class="field"><label>Vagas</label><input name="slots" type="number" min="1" max="100" value="1" required></div><div class="field"><label>Categoria</label><select name="category"><option>Atendimento</option><option>Cozinha</option><option>Recepção</option><option>Serviços gerais</option><option>Outros</option></select></div><div class="field"><label>Descrição</label><textarea name="description" required></textarea></div><button class="btn" type="submit">Publicar diária</button></form>`)}function saveJob(e){e.preventDefault();let f=new FormData(e.target);db.jobs.unshift({id:uid(),title:f.get('title').trim(),company:'Minha empresa',city:f.get('city').trim(),date:f.get('date'),value:Number(f.get('value')),slots:Number(f.get('slots')),category:f.get('category'),description:f.get('description').trim()});notify('Nova diária publicada com sucesso');hideModal();go('jobs')}function detail(id){let j=db.jobs.find(j=>j.id===id);showModal(esc(j.title),`<p>${esc(j.description)}</p><br><p>${esc(j.company)} · ${esc(j.city)}</p><br><b>${date(j.date)} — ${money(j.value)}</b><br><br>${profile==='profissional'?action('Candidatar-se',`hideModal();apply(${id})`):action('Fechar','hideModal()','light')}`)}function apply(id){if(db.applications.some(a=>a.jobId===id)){toast('Você já se candidatou a esta vaga.');return}showModal('Candidatura',`<form onsubmit="submitApply(event,${id})"><p>Preencha os dados fictícios para testar a seleção.</p><br><div class="field"><label>Nome do profissional</label><input name="name" value="Profissional Demo" required minlength="2"></div><div class="field"><label>Apresentação</label><textarea name="note" required>Tenho experiência e disponibilidade para a diária.</textarea></div><button class="btn">Enviar candidatura</button></form>`)}function submitApply(e,id){e.preventDefault();let f=new FormData(e.target);db.applications.unshift({id:uid(),jobId:id,name:f.get('name'),note:f.get('note'),status:'Pendente'});notify('Candidatura enviada');hideModal();go('applications')}function approve(id){let a=db.applications.find(a=>a.id===id);if(!a||a.status!=='Pendente')return;let j=db.jobs.find(j=>j.id===a.jobId);if(j&&j.slots<1)return toast('Sem vagas disponíveis');a.status='Aprovada';if(j)j.slots=Math.max(0,j.slots-1);db.contracts.unshift({id:uid(),jobId:a.jobId,name:a.name,status:'Em andamento'});notify('Candidatura aprovada e contrato demonstrativo criado');render()}function reject(id){let a=db.applications.find(a=>a.id===id);if(!a||a.status!=='Pendente')return;a.status='Recusada';notify('Candidatura recusada');render()}function contractDetail(id){let c=db.contracts.find(c=>c.id===id),j=db.jobs.find(j=>j.id===c.jobId);showModal('Contrato demonstrativo',`<p>Documento para simulação, sem validade de assinatura eletrônica.</p><br><p><b>Profissional:</b> ${esc(c.name)}</p><p><b>Empresa:</b> ${esc(j?.company)}</p><p><b>Serviço:</b> ${esc(j?.title)}</p><p><b>Data:</b> ${j?date(j.date):''}</p><p><b>Valor:</b> ${money(j?.value||0)}</p><p><b>Status:</b> ${esc(c.status)}</p><br>${action('Fechar','hideModal()','light')}`)}function finish(id){let c=db.contracts.find(c=>c.id===id);if(c){c.status='Concluído';notify('Diária concluída! Disponível para avaliação.');render()}}function review(id){showModal('Avaliar serviço',`<form onsubmit="saveReview(event,${id})"><div class="field"><label>Nota</label><select name="stars"><option value="5">★★★★★ (5)</option><option value="4">★★★★ (4)</option><option value="3">★★★ (3)</option><option value="2">★★ (2)</option><option value="1">★ (1)</option></select></div><div class="field"><label>Comentário</label><textarea name="comment" required minlength="3"></textarea></div><button class="btn">Registrar avaliação</button></form>`)}function saveReview(e,id){e.preventDefault();let f=new FormData(e.target);db.reviews.push({contractId:id,stars:Number(f.get('stars')),comment:f.get('comment')});notify('Avaliação registrada');hideModal();render()}function sendMessage(e){e.preventDefault();let val=$('msg').value.trim();if(!val)return;db.messages.push({id:uid(),from:profile==='empresa'?'Empresa Demo':profile==='admin'?'Administrador':'Profissional Demo',message:val,date:new Date().toLocaleDateString('pt-BR')});save();render();toast('Mensagem salva neste navegador')}function resetDemo(){if(confirm('Apagar seus testes e restaurar dados de exemplo?')){db=seed();save();go('home');toast('Dados restaurados')}}render();if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
